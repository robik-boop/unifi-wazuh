<!-- Add this remote block INSIDE the existing <ossec_config> in ossec.conf.
     Example only: replace both documentation IPs with your actual addresses.
     Use udp ONLY if the UniFi exporter sends UDP; match the actual transport
     and port. Keep the existing secure agent listener unchanged. -->
<remote>
  <connection>syslog</connection>
  <port>514</port>
  <protocol>udp</protocol>
  <allowed-ips>192.0.2.1</allowed-ips>
  <local_ip>192.0.2.10</local_ip>
</remote>
